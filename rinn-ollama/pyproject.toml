[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rinn-ollama"
version = "0.1.0"
description = "RINN (Regulatory Intelligence Neural Network) core model layer on Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ollama>=0.6,<1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26", "fastapi>=0.110", "httpx>=0.27", "python-multipart>=0.0.9"]
# Microphone + speaker client (rinn-voice). Talks to any OpenAI-compatible TTS server.
voice = ["numpy>=1.26", "sounddevice>=0.5", "httpx>=0.27", "faster-whisper>=1.1"]
# The speech server itself (rinn-voice-server): TTS endpoint + optional Whisper STT endpoint.
server = ["numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "soundfile>=0.12", "faster-whisper>=1.1"]
# TTS backends (install the one you use; all need PyTorch with CUDA, see docs/VOICE_ASSISTANT_PLAN.md)
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]
f5tts = ["f5-tts>=1.1"]
qwen3tts = ["qwen-tts>=0.1"]

[project.scripts]
rinn = "rinn.cli:main"
rinn-voice = "rinn.voice.cli:main"
rinn-voice-server = "rinn.voice.server:main"

[tool.setuptools.packages.find]
include = ["rinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
