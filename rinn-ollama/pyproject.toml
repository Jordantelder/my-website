[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rinn-ollama"
version = "0.1.0"
description = "RINN (Regulatory Intelligence Neural Network) core model layer on Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ollama>=0.6,<1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rinn = "rinn.cli:main"

[tool.setuptools.packages.find]
include = ["rinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
