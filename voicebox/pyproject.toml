[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebox"
version = "0.1.0"
description = "A generic push-to-talk voice assistant: server-side voice turns over your own local model, a knowledge folder you can teach it from, a phone web app, and a Raspberry Pi handheld client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rinn-ollama>=0.1",        # the engine: Ollama wrapper, sentence chunker, audio helpers, speech client (install from ../rinn-ollama)
  "ollama>=0.6,<1.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = ["soundfile>=0.12", "pypdf>=4.0"]
device = ["sounddevice>=0.5", "gpiozero>=2.0"]
dev = ["pytest>=8", "pypdf>=4.0", "soundfile>=0.12"]

[project.scripts]
voicebox-server = "voicebox.server:main"
voicebox-device = "voicebox.device.pi_button:main"
voicebox = "voicebox.cli:main"

[tool.setuptools.packages.find]
include = ["voicebox*"]

[tool.setuptools.package-data]
voicebox = ["web/*.html", "web/*.webmanifest", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
